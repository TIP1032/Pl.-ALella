<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--blue-dark:#06316b;--blue-mid:#0a4a9e;--blue-light:#1a6fd4;--accent:#f0a500;--red:#d63b2f;--green:#2a9d5c;--purple:#7b35c2;--amber:#c47a00;--teal:#0e7c7b;--civ:#b5451b;--civ-light:#e8623a;--text:#1a2540;--text-muted:#6b7a99;--border:#d0d8ee;--bg:#f2f5fc;--card:#fff;--header-h:56px}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;min-height:100vh}
#header{background:linear-gradient(135deg,var(--blue-dark) 0%,var(--blue-mid) 100%);height:var(--header-h);display:flex;align-items:center;padding:0 16px;gap:12px;position:sticky;top:0;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.35)}
#shield{width:36px;height:36px;flex-shrink:0;background:var(--accent);clip-path:polygon(50% 0%,100% 20%,100% 70%,50% 100%,0% 70%,0% 20%);display:flex;align-items:center;justify-content:center;font-size:18px}
#header-text .t1{color:#fff;font-weight:700;font-size:15px;letter-spacing:.03em}
#header-text .t2{color:rgba(255,255,255,.55);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
#header-stats{margin-left:auto;display:flex;gap:8px}
.hstat{text-align:center;cursor:pointer;padding:4px 6px;border-radius:4px;transition:background .15s}
.hstat:hover{background:rgba(255,255,255,.1)}
.hstat .hn{font-size:15px;font-weight:700;color:#fff}
.hstat .hl{font-size:9px;color:rgba(255,255,255,.5);letter-spacing:.06em}
#search-wrap{background:#fff;border-bottom:1px solid var(--border);padding:10px 14px;position:sticky;top:var(--header-h);z-index:19;box-shadow:0 2px 6px rgba(0,0,0,.06)}
#search-inner{display:flex;gap:8px;background:var(--bg);border:1.5px solid var(--border);border-radius:8px;padding:0 12px;align-items:center;transition:border-color .2s}
#search-inner:focus-within{border-color:var(--blue-light)}
#search-icon{color:var(--text-muted);font-size:15px;flex-shrink:0}
#q{flex:1;background:transparent;border:none;outline:none;padding:9px 0;font-size:14px;color:var(--text)}

#clear-btn{background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:16px;padding:0;display:none}
#filter-row{display:flex;gap:5px;margin-top:8px;align-items:center;flex-wrap:wrap}
.pill{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:#fff;color:var(--text-muted);transition:all .15s;letter-spacing:.03em;white-space:nowrap}
.pill.all-active{background:var(--blue-mid);border-color:var(--blue-mid);color:#fff}
.pill.kw-active{background:var(--accent);border-color:var(--accent);color:#06316b}
.pill.rgc-active{background:#06316b;border-color:#06316b;color:#fff}
.pill.lsv-active{background:#7b35c2;border-color:#7b35c2;color:#fff}
.pill.om-active{background:#2a9d5c;border-color:#2a9d5c;color:#fff}
.pill.alc-active{background:#c47a00;border-color:#c47a00;color:#fff}
.pill.sct-active{background:#0e7c7b;border-color:#0e7c7b;color:#fff}
#count-label{margin-left:auto;font-size:11px;color:var(--text-muted);font-weight:500;white-space:nowrap}
#list{padding:10px 12px 40px}
#sct-view{display:none;padding:10px 12px 40px}
#empty{text-align:center;padding:60px 20px;color:var(--text-muted);font-size:14px;display:none}
#empty .ico{font-size:36px;margin-bottom:10px}
#empty .hint{font-size:12px;color:#b0b8cc;margin-top:6px}
.card{background:var(--card);border-radius:10px;border:1px solid var(--border);margin-bottom:8px;overflow:hidden;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.06);transition:box-shadow .15s,transform .1s}
.card:active{transform:scale(.99)}
.card.open{box-shadow:0 4px 14px rgba(0,0,0,.12)}
.sct-group-body .card{border-radius:0;border-left:none;border-right:none;border-top:none;margin-bottom:0;box-shadow:none}
.sct-group-body .card:last-child{border-bottom:none}
.card-main{display:flex;align-items:stretch;min-height:52px}
.card-stripe{width:5px;flex-shrink:0}
.card-body{flex:1;padding:9px 12px;display:flex;align-items:center;gap:10px}
.code-badge{font-family:"Courier New",monospace;font-size:13px;font-weight:700;background:#06316b;color:#fff;padding:4px 9px;border-radius:5px;flex-shrink:0;letter-spacing:.04em;min-width:52px;text-align:center}
.desc-text{flex:1;font-size:13px;color:var(--text);line-height:1.4}
.desc-text mark{background:#fff3b0;color:#8a6000;border-radius:2px;padding:0 2px}
.imp-val{font-size:14px;font-weight:700;flex-shrink:0;min-width:52px;text-align:right}
.pts-chip{font-size:10px;font-weight:700;background:#fff0ee;color:var(--red);border:1px solid #f5c2be;padding:2px 6px;border-radius:4px;flex-shrink:0}
.chevron-btn{color:#c0c8d8;font-size:11px;flex-shrink:0;padding-left:4px;transition:transform .2s}
.card.open .chevron-btn{transform:rotate(180deg)}
.card-detail{display:none;border-top:1px solid var(--border);padding:12px 14px 14px 20px;background:#fafbfe}
.card.open .card-detail{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.di .dl{font-size:9px;color:var(--text-muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px;font-weight:600}
.di .dv{font-size:13px;font-weight:500;color:var(--text)}
.n-RGC .card-stripe{background:#06316b}.n-RGC .imp-val{color:#06316b}
.n-LSV .card-stripe{background:#7b35c2}.n-LSV .imp-val{color:#7b35c2}
.n-OM  .card-stripe{background:#2a9d5c}.n-OM  .imp-val{color:#1a7a45}
.alc-card .card-stripe{background:#c47a00!important}.alc-card .code-badge{background:#c47a00!important}.alc-card .imp-val{color:#c47a00!important}
.n-SCT .card-stripe{background:#0e7c7b}.n-SCT .code-badge{background:#0e7c7b!important}.n-SCT .imp-val{color:#0e7c7b}
.sct-badge-wrap{display:flex;flex-direction:column;align-items:center;flex-shrink:0;gap:2px}
.sct-art-label{font-size:9px;font-weight:700;color:#0e7c7b;letter-spacing:.04em;white-space:nowrap;text-align:center;max-width:64px}
.has-punts .imp-val{color:var(--red)!important}
.norm-tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;letter-spacing:.05em;margin-right:4px}
.norm-tag.RGC{background:#dce8fa;color:#06316b}
.norm-tag.LSV{background:#f0e6fb;color:#7b35c2}
.norm-tag.OM{background:#dff5ea;color:#1a7a45}
.norm-tag.SCT{background:#d4f0ef;color:#0e7c7b}
.sct-group{margin-bottom:10px;border-radius:10px;overflow:hidden;border:1.5px solid #b2dedd;box-shadow:0 1px 4px rgba(14,124,123,.08)}
.sct-group-header{background:linear-gradient(90deg,#0e7c7b,#1aabaa);color:#fff;padding:12px 16px;cursor:pointer;display:flex;align-items:center;gap:10px;user-select:none}
.sct-group-header .gh-icon{font-size:20px;flex-shrink:0}
.sct-group-header .gh-texts{flex:1}
.sct-group-header .gh-title{font-weight:700;font-size:13px;letter-spacing:.02em}
.sct-group-header .gh-sub{font-size:10px;opacity:.7;margin-top:2px}
.sct-group-header .gh-count{background:rgba(255,255,255,.25);padding:2px 9px;border-radius:12px;font-size:11px;font-weight:700;flex-shrink:0}
.sct-group-header .gh-chev{font-size:12px;flex-shrink:0;transition:transform .25s}
.sct-group.open .gh-chev{transform:rotate(180deg)}
.sct-group-body{display:none;background:#f7fdfd}
.sct-group.open .sct-group-body{display:block}

/* ── Subgrup accordion ─────────────────────────────── */

.sg-header{background:linear-gradient(90deg,#e8edf8,#f2f5fc);border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin-bottom:6px;cursor:pointer;display:flex;align-items:center;gap:8px;user-select:none;transition:background .15s}
.sg-header:hover{background:linear-gradient(90deg,#dce5f5,#e8edf8)}
.sg-header .sg-icon{font-size:18px;flex-shrink:0}
.sg-header .sg-title{flex:1;font-weight:700;font-size:12px;color:var(--text);letter-spacing:.02em}
.sg-header .sg-cnt{font-size:11px;color:var(--text-muted);font-weight:600;background:rgba(0,0,0,.07);padding:2px 8px;border-radius:12px;flex-shrink:0}
.sg-header .sg-chev{font-size:11px;color:var(--text-muted);flex-shrink:0;transition:transform .2s}
.sg-block.open .sg-header{background:linear-gradient(90deg,#dce5f5,#eef2fb)}
.sg-block.open .sg-chev{transform:rotate(180deg)}
.sg-body{display:none;margin-bottom:8px}
.sg-block.open .sg-body{display:block}

/* ── Civisme ───────────────────────────────────────── */
.n-CIV .card-stripe{background:var(--civ)}.n-CIV .imp-val{color:var(--civ)}
.n-CIV .code-badge{background:var(--civ)!important}
.pill.civ-active{background:var(--civ);border-color:var(--civ);color:#fff}
.hstat[data-norm="CIV"] .hn{color:#e8a87c}
.grav-chip{font-size:9px;font-weight:800;padding:2px 6px;border-radius:4px;flex-shrink:0;letter-spacing:.06em;text-transform:uppercase}
.grav-L{background:#eef7ee;color:#2a7a3b;border:1px solid #b8deba}
.grav-G{background:#fff4e0;color:#c47a00;border:1px solid #f5d690}
.grav-MG{background:#fff0ee;color:#d63b2f;border:1px solid #f5c2be}
/* CIV view container */
#civ-view{display:none;padding:10px 12px 40px}

/* ── Unified accordion (all normatives) ────────────── */
.acc-block{margin-bottom:6px;border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.acc-header{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;user-select:none;transition:filter .15s}
.acc-header:hover{filter:brightness(1.07)}
.acc-icon{font-size:18px;flex-shrink:0}
.acc-texts{flex:1}
.acc-title{font-weight:700;font-size:12px;color:#fff;letter-spacing:.02em}
.acc-sub{font-size:10px;color:rgba(255,255,255,.7);margin-top:1px}
.acc-cnt{font-size:11px;font-weight:700;background:rgba(255,255,255,.25);color:#fff;padding:2px 9px;border-radius:12px;flex-shrink:0}
.acc-chev{font-size:11px;color:rgba(255,255,255,.8);flex-shrink:0;transition:transform .2s}
.acc-block.open .acc-chev{transform:rotate(180deg)}
.acc-body{display:none;background:#fff;border:1px solid rgba(0,0,0,.08);border-top:none;border-radius:0 0 10px 10px;padding:6px 8px}
.acc-block.open .acc-body{display:block}
/* Sub-accordion (nested, level 2) */
.acc-sub-block{margin:4px 0 4px 10px;border-radius:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.acc-sub-header{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;user-select:none;background:linear-gradient(90deg,#eef3fb,#f6f9ff);border-left:3px solid #ccc;transition:filter .15s}
.acc-sub-header:hover{filter:brightness(.97)}
.acc-sub-icon{font-size:14px;flex-shrink:0}
.acc-sub-title{flex:1;font-weight:600;font-size:11px;color:#1a2540}
.acc-sub-cnt{font-size:10px;font-weight:700;background:rgba(0,0,0,.08);color:#444;padding:2px 7px;border-radius:10px;flex-shrink:0}
.acc-sub-chev{font-size:10px;color:#888;flex-shrink:0;transition:transform .2s}
.acc-sub-block.open .acc-sub-chev{transform:rotate(180deg)}
.acc-sub-body{display:none;background:#fff;border:1px solid rgba(0,0,0,.06);border-top:none;border-radius:0 0 8px 8px;padding:4px 6px}
.acc-sub-block.open .acc-sub-body{display:block}
/* Favorites tab */
#fav-view{display:none;padding:10px 12px 40px}
#kw-view{display:none;padding:10px 12px 40px}
.kw-normhdr{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin:14px 4px 6px;padding-top:4px;border-top:1px dashed var(--border)}
.kw-normhdr:first-child{margin-top:2px;border-top:none}
.fav-empty{text-align:center;padding:40px 20px;color:var(--text-muted)}
.fav-empty .ico{font-size:36px;margin-bottom:8px}
.fav-btn{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:16px;padding:4px;color:#ccc;transition:color .2s;z-index:2}
.fav-btn.active{color:#f0a500}
.card-main{position:relative}
</style>

function artRef(r){var s="Art. "+r.a;if(r.ap!=null)s+="."+r.ap;if(r.s!=null)s+="."+r.s;return s;}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function hiWords(text,words){
  if(!words.length)return esc(text);
  var markers=[],tl=text.toLowerCase();
  for(var w=0;w<words.length;w++){var wl=words[w],i=tl.indexOf(wl);while(i!==-1){markers.push({s:i,e:i+wl.length});i=tl.indexOf(wl,i+1);}}
  markers.sort(function(a,b){return a.s-b.s;});
  var out="",pos=0;
  for(var m=0;m<markers.length;m++){var mk=markers[m];if(mk.s<pos)continue;out+=esc(text.slice(pos,mk.s))+"<mark>"+esc(text.slice(mk.s,mk.e))+"</mark>";pos=mk.e;}
  return out+esc(text.slice(pos));
}
function cardHTML(r,words){
  var isOpen=expandedSeq===r.q,hasPunts=r.p>0,isAlc=r.alc===1,isSCT=r.n==="SCT";
  var cc="card n-"+r.n+(isAlc&&!isSCT?" alc-card":"")+(hasPunts?" has-punts":"")+(isOpen?" open":"");
  var ph=hasPunts?'<div class="di"><div class="dl">Punts carnet</div><div class="dv" style="color:#d63b2f;font-weight:700">\u2212'+r.p+' punts</div></div>':"";
  return '<div class="'+cc+'" data-seq="'+r.q+'">'
    +'<div class="card-main"><div class="card-stripe"></div><div class="card-body">'
    +(isSCT?'<div class="sct-badge-wrap"><div class="code-badge">SCT</div><div class="sct-art-label">Art. '+r.a+'</div></div>':'<div class="code-badge">'+r.q+'</div>')
    +'<div class="desc-text">'+hiWords(r.d,words)+'</div>'
    +(hasPunts?'<div class="pts-chip">\u2212'+r.p+'pts</div>':"")
    +'<div class="imp-val">'+r.im+'\u20ac</div>'
    +'<button class="fav-btn'+(favs[r.q]?' active':'')+' " data-fseq="'+r.q+'" onclick="toggleFav('+r.q+',event)">&#9733;</button>'
    +'<div class="chevron-btn">&#9660;</div>'
    +'</div></div>'
    +'<div class="card-detail">'
    +'<div class="di"><div class="dl">Norma</div><div class="dv"><span class="norm-tag '+r.n+'">'+r.n+'</span>'+(NORMS[r.n]||r.n)+'</div></div>'
    +'<div class="di"><div class="dl">Article</div><div class="dv">'+esc(artRef(r))+'</div></div>'
    +'<div class="di"><div class="dl">Import</div><div class="dv" style="font-weight:700">'+r.im+'\u20ac</div></div>'
    +ph+'</div></div>';
}
function bindCards(el){
  el.querySelectorAll(".card").forEach(function(c){
    c.addEventListener("click",function(){
      var seq=parseInt(this.dataset.seq);expandedSeq=expandedSeq===seq?null:seq;render();
    });
  });
}
var NORM_COLORS={RGC:"#06316b",LSV:"#7b35c2",OM:"#2a9d5c",ALC:"#c47a00",CIV:"#b5451b"};
function getSubgrupId(r,norm){
  var defs=SUBGRUPS[norm];if(!defs)return "altres";
  for(var i=0;i<defs.length-1;i++){if(defs[i].test(r))return defs[i].id;}
  return defs[defs.length-1].id;
}
function renderGrouped(items,norm,words){
  var list=document.getElementById("list");
  var defs=SUBGRUPS[norm];
  if(!defs){var h2="";items.forEach(function(r){h2+=cardHTML(r,words);});list.innerHTML=h2;bindCards(list);return;}
  var groups={};defs.forEach(function(sg){groups[sg.id]=[];});
  items.forEach(function(r){var sid=getSubgrupId(r,norm);if(!groups[sid])groups[sid]=[];groups[sid].push(r);});
  var col=NORM_COLORS[norm]||"#0a4a9e";
  var html2="";
  defs.forEach(function(sg){
    var grpItems=groups[sg.id]||[];if(grpItems.length===0)return;
    var key=norm+"_"+sg.id;
    if(openSgGroups[key]===undefined)openSgGroups[key]=false;
    var isOpen=openSgGroups[key];
    html2+='<div class="acc-block'+(isOpen?" open":"")+'" data-sgkey="'+key+'">'
      +'<div class="acc-header" style="background:linear-gradient(90deg,'+col+','+col+'cc)">'
      +'<span class="acc-icon">'+sg.icon+'</span>'
      +'<div class="acc-texts"><div class="acc-title">'+sg.label+'</div></div>'
      +'<span class="acc-cnt">'+grpItems.length+'</span>'
      +'<span class="acc-chev">▼</span>'
      +'</div>'
      +'<div class="acc-body">';
    grpItems.forEach(function(r){html2+=cardHTML(r,words);});
    html2+='</div></div>';
  });
  list.innerHTML=html2;
  list.querySelectorAll(".acc-header").forEach(function(h3){
    h3.addEventListener("click",function(e){
      e.stopPropagation();
      var key=this.parentElement.dataset.sgkey;
      openSgGroups[key]=!openSgGroups[key];
      renderGrouped(items,norm,words);
    });
  });
  bindCards(list);
}

function renderSCT(words){
  var sv=document.getElementById("sct-view");
  var grouped={};SCT_ORDER.forEach(function(k){grouped[k]=[];});
  DATA.forEach(function(r){
    if(r.n!=="SCT")return;var cat=r.cat||"RGV";if(!grouped[cat])grouped[cat]=[];
    if(words.length){var hay=(r.d+" Art. "+r.a+" "+String(r.im)).toLowerCase();if(!words.every(function(w){return hay.indexOf(w)!==-1;}))return;}
    grouped[cat].push(r);
  });
  var col="#0e7c7b";
  var html2="";
  SCT_ORDER.forEach(function(cat){
    var items=grouped[cat]||[],info=SCT_CATS[cat];
    if(items.length===0)return;
    if(openGroups[cat]===undefined)openGroups[cat]=false;
    var isOpen=openGroups[cat];
    html2+='<div class="acc-block'+(isOpen?" open":"")+'" data-cat="'+cat+'">'
      +'<div class="acc-header" style="background:linear-gradient(90deg,'+col+','+col+'cc)">'
      +'<span class="acc-icon">'+info.icon+'</span>'
      +'<div class="acc-texts"><div class="acc-title">'+info.label+'</div><div class="acc-sub">'+info.sub+'</div></div>'
      +'<span class="acc-cnt">'+items.length+'</span>'
      +'<span class="acc-chev">▼</span>'
      +'</div>'
      +'<div class="acc-body">';
    items.forEach(function(r){html2+=cardHTML(r,words);});
    html2+='</div></div>';
  });
  sv.innerHTML=html2;
  sv.querySelectorAll(".acc-header").forEach(function(h3){
    h3.addEventListener("click",function(e){
      e.stopPropagation();
      var cat=this.parentElement.dataset.cat;
      openGroups[cat]=!openGroups[cat];renderSCT(words);
    });
  });
  bindCards(sv);
  var total=0;SCT_ORDER.forEach(function(k){total+=(grouped[k]||[]).length;});
  document.getElementById("count-label").textContent=total+" resultats";
}

    +'<div class="di"><div class="dl">Article</div><div class="dv">Art. '+r.a+'</div></div>'

    +'<div class="di"><div class="dl">Import orientatiu</div><div class="dv" style="font-weight:700">'+r.im+'\u20ac</div></div>'
    +'</div></div>';
}

function renderCIV(words){
  var sv=document.getElementById("civ-view");
  var defs=SUBGRUPS.CIV;
  var grouped={};CIV_ORDER.forEach(function(k){grouped[k]=[];});
  DATA.forEach(function(r){
    if(r.n!=="CIV")return;
    if(words.length){
      var hay=(r.d+" Art. "+r.a+" "+String(r.im)+" "+(r.grav||"")).toLowerCase();
      if(!words.every(function(w){return hay.indexOf(w)!==-1;}))return;
    }
    var cat="altres_civ";
    for(var i=0;i<defs.length-1;i++){if(defs[i].test(r)){cat=defs[i].id;break;}}
    if(!grouped[cat])grouped[cat]=[];
    grouped[cat].push(r);
  });
  var col="#b5451b";
  var html2="";
  CIV_ORDER.forEach(function(cat){
    var items=grouped[cat]||[];if(items.length===0)return;
    var info=CIV_CATS[cat];
    if(openCivGroups[cat]===undefined)openCivGroups[cat]=false;
    var isOpen=openCivGroups[cat];
    html2+='<div class="acc-block'+(isOpen?" open":"")+'" data-cat="'+cat+'">'
      +'<div class="acc-header" style="background:linear-gradient(90deg,'+col+','+col+'cc)">'
      +'<span class="acc-icon">'+info.icon+'</span>'
      +'<div class="acc-texts"><div class="acc-title">'+info.label+'</div><div class="acc-sub">'+info.sub+'</div></div>'
      +'<span class="acc-cnt">'+items.length+'</span>'
      +'<span class="acc-chev">▼</span>'
      +'</div>'
      +'<div class="acc-body">';
    items.forEach(function(r){html2+=civCardHTML(r,words);});
    html2+='</div></div>';
  });
  sv.innerHTML=html2;
  sv.querySelectorAll(".acc-header").forEach(function(h3){
    h3.addEventListener("click",function(e){
      e.stopPropagation();
      var cat=this.parentElement.dataset.cat;
      openCivGroups[cat]=!openCivGroups[cat];renderCIV(words);
    });
  });
  sv.querySelectorAll(".card").forEach(function(c){
    c.addEventListener("click",function(){
      var seq=parseInt(this.dataset.seq);expandedSeq=expandedSeq===seq?null:seq;renderCIV(words);
    });
  });
  var total=0;CIV_ORDER.forEach(function(k){total+=(grouped[k]||[]).length;});
  document.getElementById("count-label").textContent=total+" resultats";
}

function renderALC(words){
  var list=document.getElementById("list"),sv=document.getElementById("sct-view"),civv=document.getElementById("civ-view");
  list.style.display="block";sv.style.display="none";civv.style.display="none";
  document.getElementById("fav-view").style.display="none";

  var res=DATA.filter(function(r){
    if(!r.alc)return false;
    if(words.length){
      var hay=(r.d+" "+String(r.q)+" Art. "+r.a+" "+String(r.im)).toLowerCase();
      return words.every(function(w){return hay.indexOf(w)!==-1;});
    }
    return true;
  });
  document.getElementById("count-label").textContent=res.length+" resultats";
  document.getElementById("empty").style.display=res.length===0?"block":"none";
  if(res.length===0){list.innerHTML="";return;}

  function vehicleCat(d){
    if(d.indexOf("BICICLETA")!==-1) return "bici";
    if(d.indexOf("VMP")!==-1) return "vmp";
    if(d.indexOf("TRANSPORT DE MERCADERIES PE")!==-1||d.indexOf("PERILLOSES")!==-1) return "mercat_perill";
    if(d.indexOf("TRANSPORT DE MERCADERIES")!==-1||d.indexOf("MMA SUPERIOR")!==-1) return "mercat";
    if(d.indexOf("TRANSPORT DE VIATGERS")!==-1) return "viatgers";
    if(d.indexOf("TRANSPORT ESCOLAR")!==-1||d.indexOf("MENORS")!==-1) return "escolar";
    if(d.indexOf("SERVEI P\u00daB")!==-1) return "serv_public";
    if(d.indexOf("SERVEI D'URG")!==-1) return "urgencia";
    if(d.indexOf("TRANSPORTS ESPECIALS")!==-1) return "especials";
    if(d.indexOf("ANTIGUITAT INFERIOR")!==-1) return "novell";
    return "general";
  }

  var VCATS=[
    {id:"general",      label:"Vehicle general",                     icon:"🚗"},
    {id:"novell",       label:"Conductor novell (permís <2 anys)",    icon:"🆕"},
    {id:"mercat",       label:"Transport de mercaderies (MMA >3.500)",icon:"🚛"},
    {id:"mercat_perill",label:"Mercaderies perilloses",               icon:"☢️"},
    {id:"viatgers",     label:"Transport de viatgers (>9 places)",    icon:"🚌"},
    {id:"escolar",      label:"Transport escolar o de menors",        icon:"🏫"},
    {id:"serv_public",  label:"Vehicle de servei públic",             icon:"🚓"},
    {id:"urgencia",     label:"Vehicle de servei d'urgència",         icon:"🚑"},
    {id:"especials",    label:"Transports especials",                 icon:"⚠️"},
    {id:"bici",         label:"Bicicleta",                            icon:"🚲"},
    {id:"vmp",          label:"VMP (vehicle de mobilitat personal)",  icon:"🛴"}
  ];

  var GRUPS=[
    {id:"rgc20", label:"Art. 20 — Taxa d'alcohol per tipus de vehicle", icon:"🍺", norm:"RGC",
     filter:function(r){return r.n==="RGC"&&r.a===20;}, useVehicle:true},
    {id:"rgc21", label:"Art. 21 — Negativa a les proves d'alcoholèmia", icon:"🚫", norm:"RGC",
     filter:function(r){return r.n==="RGC"&&r.a===21;}, useVehicle:false},
    {id:"rgc26", label:"Art. 26 — Obligacions del personal sanitari",   icon:"🏥", norm:"RGC",
     filter:function(r){return r.n==="RGC"&&r.a===26;}, useVehicle:false},
    {id:"lsv",   label:"LSV — Alcoholímetres antiarrencada i altres",   icon:"🔑", norm:"LSV",
     filter:function(r){return r.n==="LSV";}, useVehicle:false}
  ];

  var COL={RGC:"#06316b", LSV:"#7b35c2"};
  var html2="";

  GRUPS.forEach(function(grp){
    var items=res.filter(grp.filter);
    if(items.length===0)return;
    var key="ALC_"+grp.id;
    if(openSgGroups[key]===undefined)openSgGroups[key]=false;
    var isOpen=openSgGroups[key];
    var col=COL[grp.norm]||"#c47a00";

    html2+='<div class="acc-block'+(isOpen?" open":"")+'" data-sgkey="'+key+'">'
      +'<div class="acc-header" style="background:linear-gradient(90deg,'+col+','+col+'cc)">'
      +'<span class="acc-icon">'+grp.icon+'</span>'
      +'<div class="acc-texts"><div class="acc-title">'+grp.label+'</div></div>'
      +'<span class="acc-cnt">'+items.length+'</span>'
      +'<span class="acc-chev">▼</span>'
      +'</div>'
      +'<div class="acc-body">';

    if(grp.useVehicle){
      var vgroups={};VCATS.forEach(function(vc){vgroups[vc.id]=[];});
      items.forEach(function(r){var vc=vehicleCat(r.d);if(!vgroups[vc])vgroups[vc]=[];vgroups[vc].push(r);});
      VCATS.forEach(function(vc){
        var vcItems=vgroups[vc.id]||[];if(vcItems.length===0)return;
        var sskey="ALC_SS_"+grp.id+"_"+vc.id;
        if(openSgGroups[sskey]===undefined)openSgGroups[sskey]=false;
        var ssOpen=openSgGroups[sskey];
        html2+='<div class="acc-sub-block'+(ssOpen?" open":"")+'" data-sgkey="'+sskey+'" style="--acc-sub-color:'+col+'">'
          +'<div class="acc-sub-header" style="border-left-color:'+col+'">'
          +'<span class="acc-sub-icon">'+vc.icon+'</span>'
          +'<span class="acc-sub-title">'+vc.label+'</span>'
          +'<span class="acc-sub-cnt">'+vcItems.length+'</span>'
          +'<span class="acc-sub-chev">▼</span>'
          +'</div>'
          +'<div class="acc-sub-body">';
        vcItems.forEach(function(r){html2+=cardHTML(r,words);});
        html2+='</div></div>';
      });
    } else {
      items.forEach(function(r){html2+=cardHTML(r,words);});
    }
    html2+='</div></div>';
  });

  list.innerHTML=html2;
  list.querySelectorAll(".acc-header,.acc-sub-header").forEach(function(h3){
    h3.addEventListener("click",function(e){
      e.stopPropagation();
      var key=this.parentElement.dataset.sgkey;
      openSgGroups[key]=!openSgGroups[key];
      renderALC(words);
    });
  });
  bindCards(list);
}

function render(){
  var raw=document.getElementById("q").value.trim().toLowerCase();
  var words=raw.split(/\s+/).filter(function(w){return w.length>0;});
  var list=document.getElementById("list"),sv=document.getElementById("sct-view");
  var civv=document.getElementById("civ-view"),favv=document.getElementById("fav-view");
  var kwv=document.getElementById("kw-view");
  document.getElementById("clear-btn").style.display=raw?"inline":"none";

  list.style.display="none";sv.style.display="none";civv.style.display="none";favv.style.display="none";kwv.style.display="none";
  document.getElementById("empty").style.display="none";

  if(normFilter==="KW"){
    kwv.style.display="block";
    renderKW(words);
    return;
  }
  if(normFilter==="FAV"){
    favv.style.display="block";
    renderFav(words);
    return;
  }
  if(normFilter==="ALC"){renderALC(words);return;}
  if(normFilter==="SCT"){sv.style.display="block";renderSCT(words);return;}
  if(normFilter==="CIV"){civv.style.display="block";renderCIV(words);return;}

  list.style.display="block";
  var res=DATA.filter(function(r){
    if(r.n==="CIV"||r.n==="SCT")return false;
    if(r.alc&&normFilter!=="RGC"&&normFilter!=="LSV"&&normFilter!=="ALL_TRANSIT")return false;
    if(normFilter!=="ALL_TRANSIT"&&r.n!==normFilter)return false;
    if(!words.length)return true;
    var hay=(r.d+" "+String(r.q)+" Art. "+r.a+" "+String(r.im)).toLowerCase();
    return words.every(function(w){return hay.indexOf(w)!==-1;});
  });
  document.getElementById("count-label").textContent=res.length+" resultats";
  document.getElementById("empty").style.display=res.length===0?"block":"none";
  if(res.length===0){list.innerHTML="";return;}
  if(SUBGRUPS[normFilter]){
    renderGrouped(res,normFilter,words);
  } else {
    var html2="";res.forEach(function(r){html2+=cardHTML(r,words);});list.innerHTML=html2;bindCards(list);
  }
}


/* ── Favorites ────────────────────────────────────────── */
var favs=(function(){try{var s=localStorage.getItem("inf_favs");return s?JSON.parse(s):{}}catch(e){return {}}})();
function saveFavs(){try{localStorage.setItem("inf_favs",JSON.stringify(favs));}catch(e){}}
function toggleFav(seq,e){
  e.stopPropagation();
  if(favs[seq])delete favs[seq];else favs[seq]=1;
  saveFavs();
  // Refresh star in place without full re-render
  document.querySelectorAll('.fav-btn[data-fseq="'+seq+'"]').forEach(function(b){
    b.classList.toggle('active',!!favs[seq]);
  });
  if(normFilter==="FAV"){
    var raw=document.getElementById("q").value.trim().toLowerCase();
    var words=raw.split(/\s+/).filter(function(w){return w.length>0;});
    renderFav(words);
  }
}
function renderFav(words){
  var fv=document.getElementById("fav-view");
  var items=DATA.filter(function(r){
    if(!favs[r.q])return false;
    if(words.length){
      var hay=(r.d+" "+String(r.q)+" Art. "+r.a+" "+String(r.im)).toLowerCase();
      return words.every(function(w){return hay.indexOf(w)!==-1;});
    }
    return true;
  });
  document.getElementById("count-label").textContent=items.length+" favorits";
  if(items.length===0){
    fv.innerHTML='<div class="fav-empty"><div class="ico">&#11088;</div>Cap infracció als favorits.<br><small>Fes clic a l\'estrella &#9733; de qualsevol infracció per afegir-la aquí.</small></div>';
    document.getElementById("empty").style.display="none";
    return;
  }
  var html2="";
  items.forEach(function(r){
    if(r.n==="CIV")html2+=civCardHTML(r,words);
    else html2+=cardHTML(r,words);
  });
  fv.innerHTML=html2;
  bindCards(fv);
  fv.querySelectorAll(".card").forEach(function(c){
    c.addEventListener("click",function(){
      var seq=parseInt(this.dataset.seq);expandedSeq=expandedSeq===seq?null:seq;renderFav(words);
    });
  });
}

function renderKW(words){
  var kv=document.getElementById("kw-view");
  if(!words.length){
    document.getElementById("count-label").textContent="";
    kv.innerHTML='<div class="fav-empty"><div class="ico">&#x1F511;</div>Escriu una o m&eacute;s paraules clau.<br><small>Es cercar&agrave; a <b>totes</b> les normatives alhora:<br>RGC &middot; LSV &middot; OM &middot; Alcohol &middot; SCT &middot; Civisme</small></div>';
    document.getElementById("empty").style.display="none";
    return;
  }
  var items=DATA.filter(function(r){
    var hay=(r.d+" "+String(r.q)+" Art. "+r.a+" "+(NORMS[r.n]||r.n)+" "+r.n+" "+String(r.im)).toLowerCase();
    return words.every(function(w){return hay.indexOf(w)!==-1;});
  });
  document.getElementById("count-label").textContent=items.length+" resultats";
  if(items.length===0){
    kv.innerHTML="";
    document.getElementById("empty").style.display="block";
    return;
  }
  document.getElementById("empty").style.display="none";
  // Agrupar per normativa per fer-ho llegible
  var order=["RGC","LSV","OM","SCT","CIV"];
  var labels={RGC:"RGC \u00b7 Reglament General de Circulaci\u00f3",LSV:"LSV \u00b7 Llei de Seguretat Vi\u00e0ria",OM:"OM \u00b7 Ordenan\u00e7a Municipal",SCT:"SCT \u00b7 Servei Catal\u00e0 de Tr\u00e0nsit",CIV:"Civisme"};
  var byNorm={};order.forEach(function(n){byNorm[n]=[];});
  items.forEach(function(r){if(byNorm[r.n])byNorm[r.n].push(r);else{(byNorm._x=byNorm._x||[]).push(r);}});
  var html2="";
  order.forEach(function(n){
    if(!byNorm[n].length)return;
    html2+='<div class="kw-normhdr">'+labels[n]+' ('+byNorm[n].length+')</div>';
    byNorm[n].forEach(function(r){
      html2+=(r.n==="CIV"?civCardHTML(r,words):cardHTML(r,words));
    });
  });
  kv.innerHTML=html2;
  bindCards(kv);
  kv.querySelectorAll(".card").forEach(function(c){
    c.addEventListener("click",function(){
      var seq=parseInt(this.dataset.seq);expandedSeq=expandedSeq===seq?null:seq;renderKW(words);
    });
  });
}

function applyPills(){
  document.querySelectorAll(".pill").forEach(function(p){
    var n=p.dataset.norm;p.className="pill";
    if(normFilter===n){
      if(n==="FAV")p.classList.add("all-active");
      else if(n==="KW")p.classList.add("kw-active");
      else if(n==="RGC")p.classList.add("rgc-active");
      else if(n==="LSV")p.classList.add("lsv-active");
      else if(n==="OM")p.classList.add("om-active");
      else if(n==="ALC")p.classList.add("alc-active");
      else if(n==="SCT")p.classList.add("sct-active");
      else if(n==="CIV")p.classList.add("civ-active");
    }
  });
}
var counts={RGC:0,LSV:0,OM:0,ALC:0,SCT:0,CIV:0};
DATA.forEach(function(r){if(counts[r.n]!==undefined)counts[r.n]++;if(r.alc)counts.ALC++;});
document.getElementById("s-CIV").textContent=counts.CIV;
document.getElementById("s-RGC").textContent=counts.RGC;
document.getElementById("s-LSV").textContent=counts.LSV;
document.getElementById("s-OM").textContent=counts.OM;
document.getElementById("s-ALC").textContent=counts.ALC;
document.getElementById("s-SCT").textContent=counts.SCT;
document.querySelectorAll(".hstat").forEach(function(el){
  el.addEventListener("click",function(){var n=this.dataset.norm;normFilter=this.dataset.norm;expandedSeq=null;applyPills();render();});
});
document.querySelectorAll(".pill").forEach(function(btn){
  btn.addEventListener("click",function(){normFilter=this.dataset.norm;expandedSeq=null;applyPills();render();});
});
document.getElementById("q").addEventListener("input",function(){expandedSeq=null;render();});
document.getElementById("clear-btn").addEventListener("click",function(){document.getElementById("q").value="";expandedSeq=null;render();});
applyPills();render();
</script>
</body></html>
